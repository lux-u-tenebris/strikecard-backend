name: markdown

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - "**.md"
  pull_request:
    branches:
      - main
    paths:
      - "**.md"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: "./.github/shared/setup/checkout.yaml"

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # 20.0.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: "**/*.md"
